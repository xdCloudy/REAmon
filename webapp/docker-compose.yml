# REAmon Webapp Docker Compose (standalone)
# For full stack, use the root docker-compose.yml instead.

services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redamon-webapp
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # PostgreSQL (Prisma)
      DATABASE_URL: "postgresql://${POSTGRES_USER:-redamon}:${POSTGRES_PASSWORD:-redamon_secret}@host.docker.internal:5432/${POSTGRES_DB:-redamon}"
      # Neo4j (server-side graph queries)
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set - run redamon.sh (STRIDE S13)}
      # Backend services (via host network)
      RECON_ORCHESTRATOR_URL: http://host.docker.internal:8010
      AGENT_API_URL: http://host.docker.internal:8090
      AGENT_WS_URL: ws://host.docker.internal:8090/ws/agent
      WEBAPP_URL: http://localhost:3000
      REAMON_ARTIFACTS_PATH: /data/reamon-artifacts
      REAMON_MAX_ARTIFACT_BYTES: ${REAMON_MAX_ARTIFACT_BYTES:-536870912}
      REAMON_MAX_IMPORT_FILES: ${REAMON_MAX_IMPORT_FILES:-50000}
      REAMON_MAX_IMPORT_BYTES: ${REAMON_MAX_IMPORT_BYTES:-8589934592}
      REAMON_PROCESS_TIMEOUT_MS: ${REAMON_PROCESS_TIMEOUT_MS:-60000}
      REAMON_MAX_PROCESS_OUTPUT_BYTES: ${REAMON_MAX_PROCESS_OUTPUT_BYTES:-2097152}
      REAMON_DB_PUSH_ACCEPT_DATA_LOSS: ${REAMON_DB_PUSH_ACCEPT_DATA_LOSS:-false}
      REAMON_WORKER_STALE_SECONDS: ${REAMON_WORKER_STALE_SECONDS:-90}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - reamon_artifacts:/data/reamon-artifacts
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  reamon_artifacts:
    name: reamon_artifacts
