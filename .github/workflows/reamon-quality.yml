name: REAmon quality

on:
  push:
    branches:
      - main
      - master
      - reamon/bootstrap
    paths-ignore:
      - '**/*.md'
      - README.md
      - docs/**
  pull_request:
    paths-ignore:
      - '**/*.md'
      - README.md
      - docs/**

permissions:
  contents: read

concurrency:
  group: reamon-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    name: Webapp checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webapp
    env:
      POSTGRES_PASSWORD: test-password
      POSTGRES_USER: redamon
      POSTGRES_DB: redamon
      NEO4J_AUTH: neo4j/test-password
      NEO4J_PASSWORD: test-password
      REAMON_DB_PUSH_ACCEPT_DATA_LOSS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Lint REAmon code
        run: npm run lint

      - name: Build production webapp
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Render Compose configuration
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_USER: redamon
          POSTGRES_DB: redamon
          NEO4J_AUTH: neo4j/test-password
          NEO4J_PASSWORD: test-password
          REAMON_DB_PUSH_ACCEPT_DATA_LOSS: "false"
        run: docker compose config --quiet

  unit:
    name: Canonical Docker unit gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REDAMON_TEST_PARALLEL: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp test dependencies
        working-directory: webapp
        run: npm ci

      - name: Build images required by the canonical runner
        run: |
          docker build --build-arg SKIP_KB=true --tag redamon-agent:latest --file agentic/Dockerfile .
          docker build --tag redamon-recon:latest --file recon/Dockerfile .
          docker build --tag redamon-recon-orchestrator:latest recon_orchestrator
          docker build --tag redamon-ai-attack-surface:latest --file scanners/ai_attack_surface_scan/Dockerfile .
          docker build --tag redamon-capture-proxy:latest --file scanners/capture_proxy/Dockerfile .
          docker build --tag reamon-docker-broker:latest services/docker_broker

      - name: Run the complete unit gate
        run: ./redamon.sh test unit

  image:
    name: Production image smoke test
    runs-on: ubuntu-24.04
    needs: webapp
    env:
      COMPOSE_PROJECT_NAME: reamon-ci
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_USER: redamon
      POSTGRES_DB: redamon
      POSTGRES_CPUS: "1"
      POSTGRES_MEM: 512m
      NEO4J_PASSWORD: ci-neo4j-password
      NEO4J_CPUS: "2"
      NEO4J_MEM: 1g
      NEO4J_HEAP: 512m
      NEO4J_PAGECACHE: 256m
      AUTH_SECRET: ci-auth-secret
      INTERNAL_API_KEY: ci-internal-key
      SCANNER_API_KEY: ci-scanner-key
      AGENT_WS_TICKET_SECRET: ci-ws-ticket-secret
      REAMON_WEBAPP_IMAGE: reamon-webapp:ci
      REAMON_BUILD_SHA: ${{ github.sha }}
      REAMON_BUILD_DIRTY: "false"
      WEBAPP_PORT: "3000"
      WEBAPP_CPUS: "1"
      AGENT_PORT: "8090"
      AGENT_MEM: "2g"
      AGENT_CPUS: "2"
      AGENT_PIDS: "512"
      REAMON_WORKER_POLL_SECONDS: "5"
      REAMON_WORKER_STALE_AFTER_MINUTES: "5"
      REAMON_WORKER_LIVENESS_TIMEOUT_SECONDS: "60"
      REAMON_WORKER_BACKFILL_INTERVAL_SECONDS: "0"
      REAMON_WORKER_RETENTION_INTERVAL_SECONDS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build production image
        run: >-
          docker build
          --build-arg REAMON_BUILD_SHA="$GITHUB_SHA"
          --build-arg REAMON_BUILD_DIRTY=false
          --tag reamon-webapp:ci webapp

      - name: Verify non-root runtime image
        run: >-
          docker run --rm --entrypoint sh reamon-webapp:ci -lc
          'set -eu;
          test "$(id -u)" != 0;
          sh -n /app/entrypoint.sh;
          test -f /app/server.js;
          test -x /app/entrypoint.sh;
          test -d /data/reamon-artifacts;
          grep -R -q worker.degraded /app/.next/server;
          grep -R -q projectionRunId /app/.next/server;
          test -f /app/prisma/migrations/20261003000000_add_reamon_projection_runs/migration.sql;
          echo production-image-smoke-passed'

      - name: Verify image source revision
        run: >-
          test "$(docker image inspect
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          reamon-webapp:ci)" = "$GITHUB_SHA"

      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: reamon-webapp:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build ticketed terminal images
        run: >-
          docker compose --profile project-worker-image build
          agent docker-broker project-worker-image

      - name: Start live release stack
        run: docker compose up -d postgres neo4j webapp agent docker-broker reamon-worker

      - name: Wait for live readiness
        run: >-
          for attempt in $(seq 1 90); do
          if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
          exit 0; fi; sleep 2; done;
          docker compose logs --tail=200 webapp postgres neo4j;
          exit 1

      - name: Wait for isolated terminal services
        run: |
          for attempt in $(seq 1 90); do
            agent_state="$(docker inspect --format '{{.State.Health.Status}}' redamon-agent 2>/dev/null || true)"
            broker_state="$(docker inspect --format '{{.State.Health.Status}}' reamon-docker-broker 2>/dev/null || true)"
            worker_id="$(docker compose ps -q reamon-worker 2>/dev/null || true)"
            worker_state="$(docker inspect --format '{{.State.Health.Status}}' "$worker_id" 2>/dev/null || true)"
            if [ "$agent_state" = healthy ] && [ "$broker_state" = healthy ] && [ "$worker_state" = healthy ]; then
              echo "agent, docker broker, and task worker are healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=200 agent docker-broker
          docker compose logs --tail=200 reamon-worker
          exit 1

      - name: Verify PostgreSQL-backed agent conversation recovery
        run: |
          set -eu
          agent_id="$(docker compose ps -q agent)"
          test -n "$agent_id"
          docker cp agentic/tests/test_checkpointer_restart_live.py \
            "$agent_id:/tmp/test_checkpointer_restart_live.py"
          docker cp agentic/pytest.ini "$agent_id:/tmp/agentic-pytest.ini"
          cleanup() {
            docker compose exec -T agent rm -f \
              /tmp/test_checkpointer_restart_live.py /tmp/agentic-pytest.ini \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker compose exec -T agent python -m pytest -q \
            -c /tmp/agentic-pytest.ini /tmp/test_checkpointer_restart_live.py

      - name: Verify live build identity
        run: >-
          curl --fail --silent http://127.0.0.1:3000/api/health/ready |
          node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => {
            const ready = JSON.parse(data);
            if (ready.build?.revision !== process.env.GITHUB_SHA || ready.build?.dirty !== false) {
              console.error("unexpected live build identity", ready.build);
              process.exit(1);
            }
          })'

      - name: Seed disposable acceptance operator
        run: >-
          docker compose exec -T
          -e ADMIN_NAME='CI Acceptance Operator'
          -e ADMIN_EMAIL=acceptance@reamon.invalid
          -e ADMIN_PASSWORD=ci-acceptance-password
          webapp node scripts/create-admin.mjs

      - name: Hold the background worker for the failover fixture
        run: docker compose stop reamon-worker

      - name: Run authenticated live acceptance
        env:
          REAMON_ACCEPTANCE_BASE_URL: http://127.0.0.1:3000
          REAMON_ACCEPTANCE_INTERNAL_KEY: ci-internal-key
          REAMON_ACCEPTANCE_EMAIL: acceptance@reamon.invalid
          REAMON_ACCEPTANCE_PASSWORD: ci-acceptance-password
          REAMON_ACCEPTANCE_STATE_FILE: /tmp/reamon-acceptance-state.json
        run: node tooling/scripts/reamon-staging-acceptance.mjs

      - name: Install browser smoke dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir playwright==1.62.0
          python3 -m playwright install --with-deps chromium

      - name: Seed browser investigation queue fixture
        run: |
          project_id="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/reamon-acceptance-state.json", "utf8")); process.stdout.write(value.projectId)')"
          docker compose exec -T -e REAMON_BROWSER_PROJECT_ID="$project_id" webapp node scripts/seed-investigation-queue-smoke.mjs

      - name: Run browser login smoke test
        env:
          REAMON_BROWSER_BASE_URL: http://127.0.0.1:3000
          REAMON_BROWSER_EMAIL: acceptance@reamon.invalid
          REAMON_BROWSER_PASSWORD: ci-acceptance-password
          REAMON_BROWSER_TERMINAL_WS_URL: ws://127.0.0.1:8090/ws/kali-terminal
        run: >-
          REAMON_BROWSER_PROJECT_ID="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/reamon-acceptance-state.json", "utf8")); process.stdout.write(value.projectId)')"
          REAMON_BROWSER_IMPORT_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/reamon-browser-smoke.json"
          python3 tooling/scripts/reamon-browser-smoke.py

      - name: Verify terminal worker cleanup
        if: always()
        run: |
          for attempt in $(seq 1 30); do
            workers="$(docker ps -aq --filter label=reamon.terminal-worker=1)"
            networks="$(docker network ls -q --filter label=reamon.terminal-worker=1)"
            if [ -z "$workers" ] && [ -z "$networks" ]; then
              echo "no terminal workers or networks remain"
              exit 0
            fi
            sleep 2
          done
          docker ps -a --filter label=reamon.terminal-worker=1
          docker network ls --filter label=reamon.terminal-worker=1
          exit 1

      - name: Run two-replica worker crash and recovery drill
        run: >-
          REAMON_FAILOVER_TASK_ID="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/reamon-acceptance-state.json", "utf8")); process.stdout.write(value.failoverTaskId)')"
          REAMON_FAILOVER_STALE_AFTER_MINUTES=5
          tooling/scripts/reamon-worker-failover-drill.sh

      - name: Verify task-worker event-loop self-recovery
        run: |
          worker_id="$(docker compose ps -q reamon-worker)"
          before_restart="$(docker inspect --format '{{.RestartCount}}' "$worker_id")"
          docker compose exec -T reamon-worker sh -ec 'kill -STOP "$(cat /tmp/reamon-task-worker.pid)"'
          for attempt in $(seq 1 50); do
            restart_count="$(docker inspect --format '{{.RestartCount}}' "$worker_id" 2>/dev/null || echo 0)"
            state="$(docker inspect --format '{{.State.Status}}' "$worker_id" 2>/dev/null || true)"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$worker_id" 2>/dev/null || true)"
            if [ "$restart_count" -gt "$before_restart" ] && [ "$state" = running ] && [ "$health" = healthy ]; then
              docker compose exec -T reamon-worker node scripts/reamon-worker-healthcheck.mjs
              echo "task worker child was restarted after an event-loop stall"
              exit 0
            fi
            sleep 3
          done
          docker compose inspect reamon-worker
          docker compose logs --tail=200 reamon-worker
          exit 1

      - name: Run bounded worker load and soak drill
        run: >-
          REAMON_SOAK_ARTIFACT_ID="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/reamon-acceptance-state.json", "utf8")); process.stdout.write(value.recoveryArtifactId)')"
          REAMON_SOAK_TASK_COUNT=4
          REAMON_SOAK_DURATION_SECONDS=30
          tooling/scripts/reamon-worker-soak-drill.sh

      - name: Verify PostgreSQL and artifact restore
        env:
          REAMON_DRILL_COMPOSE_RESTORE_DATABASE: reamon_restore_check
          REAMON_DRILL_OUTPUT_DIR: /tmp/reamon-postgres-restore-evidence
        run: tooling/scripts/reamon-backup-restore-drill.sh --compose

      - name: Verify Neo4j dump and restore
        env:
          REAMON_NEO4J_DRILL_OUTPUT_DIR: /tmp/reamon-neo4j-restore-evidence
        run: tooling/scripts/reamon-neo4j-backup-restore-drill.sh --compose

      - name: Recheck readiness after restore drill
        run: >-
          for attempt in $(seq 1 90); do
          if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
          exit 0; fi; sleep 2; done;
          docker compose logs --tail=200 webapp postgres neo4j;
          exit 1

      - name: Tear down live release stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  agentic:
    name: Agent dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build test agent image without optional KB models
        run: >-
          docker build --build-arg SKIP_KB=true
          --tag redamon-agent:latest
          --file agentic/Dockerfile .

      - name: Audit installed Python dependencies
        run: >-
          docker run --rm redamon-agent:latest sh -lc
          'pip install --disable-pip-version-check --no-cache-dir pip-audit >/dev/null
          && pip-audit --strict'
