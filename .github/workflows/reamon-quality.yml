name: REAmon quality

on:
  push:
    branches:
      - main
      - master
      - reamon/bootstrap
  pull_request:

permissions:
  contents: read

concurrency:
  group: reamon-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    name: Webapp checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    env:
      POSTGRES_PASSWORD: test-password
      POSTGRES_USER: redamon
      POSTGRES_DB: redamon
      NEO4J_AUTH: neo4j/test-password
      NEO4J_PASSWORD: test-password
      REAMON_DB_PUSH_ACCEPT_DATA_LOSS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Lint REAmon code
        run: npm run lint

      - name: Run REAmon tests
        run: npm run test -- --run

      - name: Build production webapp
        run: npm run build

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Render Compose configuration
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_USER: redamon
          POSTGRES_DB: redamon
          NEO4J_AUTH: neo4j/test-password
          NEO4J_PASSWORD: test-password
          REAMON_DB_PUSH_ACCEPT_DATA_LOSS: "false"
        run: docker compose config --quiet

  image:
    name: Production image smoke test
    runs-on: ubuntu-latest
    needs: webapp
    env:
      COMPOSE_PROJECT_NAME: reamon-ci
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_USER: redamon
      POSTGRES_DB: redamon
      POSTGRES_CPUS: "1"
      POSTGRES_MEM: 512m
      NEO4J_PASSWORD: ci-neo4j-password
      NEO4J_CPUS: "2"
      NEO4J_MEM: 1g
      NEO4J_HEAP: 512m
      NEO4J_PAGECACHE: 256m
      AUTH_SECRET: ci-auth-secret
      INTERNAL_API_KEY: ci-internal-key
      REAMON_WEBAPP_IMAGE: reamon-webapp:ci
      WEBAPP_PORT: "3000"
      WEBAPP_CPUS: "1"
      REAMON_WORKER_POLL_SECONDS: "5"
      REAMON_WORKER_STALE_AFTER_MINUTES: "5"
      REAMON_WORKER_BACKFILL_INTERVAL_SECONDS: "0"
      REAMON_WORKER_RETENTION_INTERVAL_SECONDS: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag reamon-webapp:ci webapp

      - name: Verify non-root runtime image
        run: >-
          docker run --rm --entrypoint sh reamon-webapp:ci -lc
          'set -eu;
          test "$(id -u)" != 0;
          sh -n /app/entrypoint.sh;
          test -f /app/server.js;
          test -x /app/entrypoint.sh;
          test -d /data/reamon-artifacts;
          grep -R -q worker.degraded /app/.next/server;
          grep -R -q projectionRunId /app/.next/server;
          test -f /app/prisma/migrations/20261003000000_add_reamon_projection_runs/migration.sql;
          echo production-image-smoke-passed'

      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: reamon-webapp:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start live release stack
        run: docker compose up -d postgres neo4j webapp

      - name: Wait for live readiness
        run: >-
          for attempt in $(seq 1 90); do
          if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
          exit 0; fi; sleep 2; done;
          docker compose logs --tail=200 webapp postgres neo4j;
          exit 1

      - name: Seed disposable acceptance operator
        run: >-
          docker compose exec -T
          -e ADMIN_NAME='CI Acceptance Operator'
          -e ADMIN_EMAIL=acceptance@reamon.invalid
          -e ADMIN_PASSWORD=ci-acceptance-password
          webapp node scripts/create-admin.mjs

      - name: Run authenticated live acceptance
        env:
          REAMON_ACCEPTANCE_BASE_URL: http://127.0.0.1:3000
          REAMON_ACCEPTANCE_INTERNAL_KEY: ci-internal-key
          REAMON_ACCEPTANCE_EMAIL: acceptance@reamon.invalid
          REAMON_ACCEPTANCE_PASSWORD: ci-acceptance-password
          REAMON_ACCEPTANCE_STATE_FILE: /tmp/reamon-acceptance-state.json
        run: node tooling/scripts/reamon-staging-acceptance.mjs

      - name: Install browser smoke dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir playwright==1.62.0
          python3 -m playwright install --with-deps chromium

      - name: Run browser login smoke test
        env:
          REAMON_BROWSER_BASE_URL: http://127.0.0.1:3000
          REAMON_BROWSER_EMAIL: acceptance@reamon.invalid
          REAMON_BROWSER_PASSWORD: ci-acceptance-password
        run: >-
          REAMON_BROWSER_PROJECT_ID="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/reamon-acceptance-state.json", "utf8")); process.stdout.write(value.projectId)')"
          REAMON_BROWSER_IMPORT_FIXTURE="$GITHUB_WORKSPACE/tests/fixtures/reamon-browser-smoke.json"
          python3 tooling/scripts/reamon-browser-smoke.py

      - name: Run two-replica worker crash and recovery drill
        run: >-
          REAMON_FAILOVER_TASK_ID="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/reamon-acceptance-state.json", "utf8")); process.stdout.write(value.failoverTaskId)')"
          REAMON_FAILOVER_STALE_AFTER_MINUTES=5
          tooling/scripts/reamon-worker-failover-drill.sh

      - name: Run bounded worker load and soak drill
        run: >-
          REAMON_SOAK_ARTIFACT_ID="$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/reamon-acceptance-state.json", "utf8")); process.stdout.write(value.recoveryArtifactId)')"
          REAMON_SOAK_TASK_COUNT=4
          REAMON_SOAK_DURATION_SECONDS=30
          tooling/scripts/reamon-worker-soak-drill.sh

      - name: Verify PostgreSQL and artifact restore
        env:
          REAMON_DRILL_COMPOSE_RESTORE_DATABASE: reamon_restore_check
          REAMON_DRILL_OUTPUT_DIR: /tmp/reamon-postgres-restore-evidence
        run: tooling/scripts/reamon-backup-restore-drill.sh --compose

      - name: Verify Neo4j dump and restore
        env:
          REAMON_NEO4J_DRILL_OUTPUT_DIR: /tmp/reamon-neo4j-restore-evidence
        run: tooling/scripts/reamon-neo4j-backup-restore-drill.sh --compose

      - name: Recheck readiness after restore drill
        run: >-
          for attempt in $(seq 1 90); do
          if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready; then
          exit 0; fi; sleep 2; done;
          docker compose logs --tail=200 webapp postgres neo4j;
          exit 1

      - name: Tear down live release stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  agentic:
    name: Agentic Python unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build test agent image without optional KB models
        run: >-
          docker build --build-arg SKIP_KB=true
          --tag redamon-agent:latest
          --file agentic/Dockerfile .

      - name: Audit installed Python dependencies
        run: >-
          docker run --rm redamon-agent:latest sh -lc
          'pip install --disable-pip-version-check --no-cache-dir pip-audit >/dev/null
          && pip-audit --strict'

      - name: Run isolated Python unit gate
        env:
          REDAMON_TEST_PARALLEL: "2"
        run: ./agentic/run_tests.sh unit
