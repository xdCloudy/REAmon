name: REAmon product progress

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: reamon-product-progress-main
  # Let queued main-branch updates serialize instead of cancelling the run
  # that is already preparing a README commit.
  cancel-in-progress: false

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate weighted progress block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            latest_sha="$(git rev-parse origin/main)"
            node tooling/reamon/update-product-progress.mjs "$latest_sha"
            if git diff --quiet -- README.md; then
              echo "README progress is already current at $latest_sha"
              exit 0
            fi
            git add README.md
            git commit -m "docs: refresh weighted product progress"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during progress update (attempt $attempt); retrying"
          done
          echo "Could not publish README progress after five attempts" >&2
          exit 1
