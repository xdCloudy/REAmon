name: REAmon release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish versioned source release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches VERSION
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_TAG}" = "v$(tr -d '[:space:]' < VERSION)"

      - name: Require green quality workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow reamon-quality.yml \
            --commit "${GITHUB_SHA}" \
            --limit 20 \
            --json status,conclusion,headSha,url)"
          echo "${runs}"
          passing="$(jq '[.[] | select(.headSha == env.GITHUB_SHA and .status == "completed" and .conclusion == "success")] | length' <<<"${runs}")"
          test "${passing}" -ge 1

      - name: Build source archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="REAmon-${RELEASE_TAG}/" "${GITHUB_SHA}" > "REAmon-${RELEASE_TAG}.tar.gz"
          sha256sum "REAmon-${RELEASE_TAG}.tar.gz" > "REAmon-${RELEASE_TAG}.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "${RELEASE_TAG}"
          "REAmon-${RELEASE_TAG}.tar.gz"
          "REAmon-${RELEASE_TAG}.tar.gz.sha256"
          --verify-tag
          --generate-notes
          --title "REAmon ${RELEASE_TAG}"
